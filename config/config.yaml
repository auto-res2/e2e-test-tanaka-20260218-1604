# Main configuration for RC-CoT experiments
defaults:
  - _self_
  - run: ???  # loads from config/run/, accessible as 'run=' in CLI

# Execution mode: main, sanity_check, or pilot
mode: main

# Results output directory
results_dir: .research/results

# WandB configuration
wandb:
  entity: airas
  project: 2026-02-18
  mode: online

# Inference configuration
inference:
  cache_dir: .cache
  seed: 42
  num_samples: null  # null means use full dataset
  
# Run configuration (overridden by specific run configs)
run:
  run_id: ???
  method: ???
  model: ???
  dataset: ???
