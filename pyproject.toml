[project]
name = "rc-cot-experiments"
version = "0.1.0"
description = "Risk-Controlling Conformal Triggered Chain-of-Thought experiments"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.0",
    "wandb>=0.16.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [VALIDATOR FIX - Attempt 1]
# [PROBLEM]: Package build failed with "ValueError: Unable to determine which files to ship inside the wheel"
# [CAUSE]: Hatchling cannot find a directory matching project name "rc_cot_experiments"; the source code is in "src/" directory
# [FIX]: Added [tool.hatch.build.targets.wheel] configuration specifying packages = ["src"] to tell hatchling where to find the package files
#
# [OLD CODE]:
# (missing hatch configuration)
#
# [NEW CODE]:
[tool.hatch.build.targets.wheel]
packages = ["src"]
